<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BisaRx - Pharmacist Portal</title>
  <meta name="description" content="BisaRx: Professional medication guidance and clinical review.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/accessibility.js?v=20261127-workspace" defer></script>
<link rel="stylesheet" href="/css/workspace.css?v=20261127-redesign">
<link rel="stylesheet" href="/css/workspace-glass.css?v=20261127-glass"><script src="/js/workspace.js?v=20261127-glass"></script>
</head>
<body data-portal="pharmacist" class="portal-locked">


<!-- LOGIN MODAL -->
<div id="login-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLoginModal()" title="Close" aria-label="Close dialog"><span data-icon="close"></span></button>
    <div class="login-header">
      <img src="logo.png" alt="BisaRx Logo" class="modal-logo">
      <h2>BisaRx</h2>
      <p>Pharmacist Sign In</p>
    </div>
    <form id="form-login" onsubmit="event.preventDefault(); doLogin();">
      <div class="auth-role-switch" style="display:none;">
        <button type="button" id="login-role-pharmacist" data-role="pharmacist" class="on"></button>
      </div>
      <p class="auth-mode-help" id="login-mode-help">Clinical Staff Access</p>
      <div class="form-group" id="login-username-group">
        <label for="login-username" id="login-username-label">Pharmacist Username</label>
        <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-pass" id="login-pass-label">Password</label>
        <input type="password" id="login-pass" placeholder="Password" required autocomplete="current-password">
      </div>
      <div id="login-err" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-do-login">Sign In</button>
    </form>
  </div>
</div>

<div id="portal-gate">
  <div class="portal-gate-card">
    <h1>Pharmacist Portal</h1>
    <p>Please sign in to manage patient cases and prescriptions.</p>
    <div class="portal-gate-actions">
      <button class="btn btn-primary" onclick="openLoginModal()">Sign In</button>
      <a class="btn btn-secondary" href="/">Exit</a>
    </div>
  </div>
</div>

<div id="main-app">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-container">
    <header class="mobile-header app-mobile-header">
      <div class="mobile-brand-lockup">
        <img src="logo.png" alt="">
        <span class="mobile-brand-copy"><strong>BisaRx</strong><small>Pharmacist workspace</small></span>
      </div>
      <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle menu" style="background:var(--mist-100);border:1px solid var(--mist-200);padding:8px;border-radius:11px;cursor:pointer;color:var(--mist-600);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </header>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo.png" alt="BisaRx Logo">
          <div class="sidebar-brand"><span class="brand-name">BisaRx</span><span class="brand-tag">Pharmacist</span></div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="#" class="nav-item on" id="nav-pharmacist" onclick="go('pharmacist', this)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
            <span>Case workspace</span>
          </a>

        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-footer" id="user-footer">
          <button class="btn-logout-link" onclick="signOut()">Sign Out</button>
        </div>
      </div>
    </aside>

    <main class="main-content">


      <!-- Pharmacist Dashboard -->
      <section class="panel on" id="panel-pharmacist">
        <div class="panel-header">
          <div class="panel-info">
            <h2>Patient cases</h2>
            <p>Review intake, provide guidance, and manage your cases.</p>
          </div>
          <div class="panel-badges">
            <span class="badge badge-success">Online</span>
            <label style="display:inline-flex; align-items:center; gap:6px; font-size:.85rem; cursor:pointer;">
              <input type="checkbox" id="ph-accepting-cases" checked onchange="toggleAcceptingCases(this)" aria-label="ph accepting cases">
              Accepting new cases
            </label>
          </div>
        </div>

        <div class="profile-tabs">
          <button class="profile-tab ntab on" onclick="showPharmaTab('pending',this)">Available cases</button>
          <button class="profile-tab ntab" onclick="showPharmaTab('assigned',this)">Assigned to me</button>
          <button class="profile-tab ntab" onclick="showPharmaTab('completed',this)">Completed</button>
        </div>

        <div class="stats-grid" style="margin-bottom: 20px;">
          <div class="stat-card stat-card--queue"><span class="stat-label">Queue</span><span class="stat-value" id="ph-stat-pending">0</span></div>
          <div class="stat-card stat-card--active"><span class="stat-label">Active</span><span class="stat-value" id="ph-stat-assigned">0</span></div>
          <div class="stat-card stat-card--done"><span class="stat-label">Done</span><span class="stat-value" id="ph-stat-completed">0</span></div>
        </div>

        <div id="pharma-tab-pending">
          <div class="pharmacist-queue-wrapper">
            <div id="pharmacist-pending-queue" class="pharmacist-queue"></div>
          </div>
        </div>
        <div id="pharma-tab-assigned" style="display:none;">
          <div class="pharmacist-queue-wrapper">
            <div id="pharmacist-queue" class="pharmacist-queue"></div>
          </div>
        </div>
        <div id="pharma-tab-completed" style="display:none;">
          <div class="pharmacist-queue-wrapper">
            <div id="pharmacist-completed" class="pharmacist-queue"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>window.BISARX_PORTAL = "pharmacist";</script>
<script src="js/config.js"></script>
<script src="js/ui-core.js?v=20260710"></script>
<script src="js/app.js?v=20261127-redesign"></script>
</body>
</html>
